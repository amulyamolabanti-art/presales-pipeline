name: CI - PR Validation & Quality Gate

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Infrastructure (Bicep) Validation
  # ============================================================================
  validate-infra:
    name: Infra / Bicep Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          az bicep install

      - name: Lint Bicep Baseline
        run: |
          az bicep lint --file infra/main.bicep

      - name: Build Bicep Baseline
        run: |
          az bicep build --file infra/main.bicep

      - name: Validate Dev & Prod Parameters
        run: |
          az bicep build-params --file infra/main.dev.bicepparam
          az bicep build-params --file infra/main.prod.bicepparam

  # ============================================================================
  # 2. Bot Component (Build, Lint & Unit Tests)
  # ============================================================================
  test-bot:
    name: Bot / Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'src/bot/requirements.txt'

      - name: Install System Dependencies (ODBC)
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Install Bot Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f src/bot/requirements.txt ]; then pip install -r src/bot/requirements.txt; fi

      - name: Lint Bot Code
        run: |
          flake8 src/bot --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/bot --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Bot Unit Tests
        run: |
          pytest src/bot -v

  # ============================================================================
  # 3. AI Orchestrator Component (Build, Lint & Unit Tests)
  # ============================================================================
  test-orchestrator:
    name: Orchestrator / Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Orchestrator Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f src/orchestrator/requirements.txt ]; then pip install -r src/orchestrator/requirements.txt; fi

      - name: Lint Orchestrator Code
        run: |
          flake8 src/orchestrator --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/orchestrator --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Orchestrator Unit Tests
        run: |
          pytest src/orchestrator -v

  # ============================================================================
  # 4. Tab Component (Frontend React + Fluent UI v9 Validation)
  # ============================================================================
  test-tab:
    name: Tab / Lint, Type-Check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/tab/package-lock.json'

      - name: Install Tab Dependencies
        working-directory: src/tab
        run: |
          npm ci

      - name: Type-Check Tab (tsc)
        working-directory: src/tab
        run: |
          npm run type-check

      - name: Lint Tab (ESLint)
        working-directory: src/tab
        run: |
          npm run lint

      - name: Run Tab Unit & Component Tests (Vitest)
        working-directory: src/tab
        run: |
          npm test

      - name: Build Tab Production Bundle (Vite)
        working-directory: src/tab
        run: |
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Legacy Tab Validation Tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest src/tab -v

  # ============================================================================
  # 5. Unified Quality Gate (Used for Branch Protection)
  # ============================================================================
  ci-gate:
    name: CI Quality Gate (All Checks Passed)
    runs-on: ubuntu-latest
    needs:
      - validate-infra
      - test-bot
      - test-orchestrator
      - test-tab
    steps:
      - name: Check Status
        run: |
          echo "=========================================================="
          echo "✅ All CI quality gates passed successfully!"
          echo "   - Infrastructure (Bicep baseline & parameters): PASSED"
          echo "   - Bot (Lint & unit tests):                      PASSED"
          echo "   - Orchestrator (Lint & unit tests):             PASSED"
          echo "   - Tab (React, Fluent UI v9, types, tests, build):PASSED"
          echo "=========================================================="

