trigger:
- main

variables:
  pythonVersion: '3.11'

stages:

# ==============================
# LINUX
# ==============================
- stage: Linux
  displayName: 'Linux Pipeline'

  jobs:
  - job: Linux_Build
    displayName: 'Linux - Build'

    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    - task: UsePythonVersion@0
      displayName: 'Set up Python 3.11 - Linux'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python --version
        python -m pip --version
      displayName: 'Verify Python - Linux'


# ==============================
# WINDOWS
# ==============================
- stage: Windows
  displayName: 'Windows Pipeline'

  dependsOn: Linux
  condition: always()

  jobs:
  - job: Windows_Build
    displayName: 'Windows - Build'

    pool:
      vmImage: 'windows-latest'

    steps:
    - checkout: self

    - task: UsePythonVersion@0
      displayName: 'Set up Python 3.11 - Windows'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python --version
        python -m pip --version
      displayName: 'Verify Python - Windows'