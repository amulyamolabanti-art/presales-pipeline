trigger:
- main

variables:
  pythonVersion: '3.11'

stages:

# =========================================================
# STAGE 1 - LINUX
# =========================================================
- stage: Linux
  displayName: 'Linux Pipeline'

  jobs:
  - job: Linux_Test
    displayName: 'Linux - Build and Test'

    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: UsePythonVersion@0
      displayName: 'Set up Python 3.11'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        python -m pipinstall -r requirements.txt
        python -m pip install pytest
      displayName: 'Install Dependencies - Linux'

    - script: |
        python -m pytest tests/ -v
      displayName: 'Run Python Tests - Linux'


# =========================================================
# STAGE 2 - WINDOWS
# =========================================================
- stage: Windows
  displayName: 'Windows Pipeline'
  dependsOn: Linux
  condition: always()

  jobs:
  - job: Windows_Test
    displayName: 'Windows - Build and Test'

    pool:
      vmImage: 'windows-latest'

    steps:
    - checkout: self

    - task: UsePythonVersion@0
      displayName: 'Set up Python 3.11'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install Dependencies - Windows'

    - script: |
        python -m pytest tests/ -v
      displayName: 'Run Python Tests - Windows'