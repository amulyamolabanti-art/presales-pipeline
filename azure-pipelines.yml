trigger:
- main

variables:
  pythonVersion: '3.11'

stages:

# =========================
# LINUX
# =========================
- stage: Linux
  displayName: 'Linux Pipeline'

  jobs:
  - job: Linux_Test
    displayName: 'Linux - Build and Test'

    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: 'Set up Python 3.11'

    - script: |
        python --version
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pytest --version
      displayName: 'Install Dependencies'

    - script: |
        python -m pytest tests/ -v
      displayName: 'Run Python Tests - Linux'